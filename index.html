<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101311">
    <title>Field / Camera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
        --ink: #101311;
        --paper: #eef1e9;
        --muted: #929991;
        --line: rgba(238, 241, 233, .18);
        --acid: #d4f36a;
        --mono: "DM Mono", "Courier New", monospace;
        --display: "Space Grotesk", "Trebuchet MS", sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--ink);
        color: var(--paper);
      }

      body {
        font-family: var(--display);
        -webkit-font-smoothing: antialiased;
      }

      button { font: inherit; }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 420px;
        isolation: isolate;
        overflow: hidden;
        background-color: var(--ink);
        background-image:
          linear-gradient(rgba(238, 241, 233, .025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(238, 241, 233, .025) 1px, transparent 1px),
          radial-gradient(ellipse at 50% 45%, #242a24 0%, #171b18 44%, #101311 78%);
        background-size: 48px 48px, 48px 48px, auto;
      }

      .camera-feed {
        position: absolute;
        z-index: -1;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity .35s ease;
        background: #090b09;
      }

      .stage.is-live .camera-feed { opacity: 1; }

      .sketch-overlay {
        position: absolute;
        z-index: 1;
        top: 50%;
        left: 50%;
        width: min(55vw, 560px);
        max-height: 64vh;
        object-fit: contain;
        opacity: .5;
        cursor: grab;
        touch-action: none;
        transform: translate(-50%, -50%) scale(var(--sketch-scale, 1));
      }

      .sketch-overlay.is-dragging { cursor: grabbing; }

      .sketch-controls {
        position: absolute;
        z-index: 3;
        right: clamp(22px, 4.2vw, 64px);
        bottom: 105px;
        display: none;
        width: min(280px, calc(100vw - 44px));
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        background: rgba(16, 19, 17, .88);
        backdrop-filter: blur(12px);
        pointer-events: auto;
      }

      .stage.is-live .sketch-controls,
      body.xr-active .sketch-controls { display: grid; }

      .sketch-control {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr) 38px;
        align-items: center;
        gap: 9px;
        color: var(--paper);
        font: 10px var(--mono);
        text-transform: uppercase;
      }

      .sketch-control input {
        width: 100%;
        height: 18px;
        margin: 0;
        accent-color: var(--acid);
        cursor: pointer;
      }

      .sketch-control output {
        color: var(--acid);
        text-align: right;
      }

      .fix-sketch-button {
        min-height: 34px;
        border: 1px solid var(--acid);
        background: transparent;
        color: var(--acid);
        cursor: pointer;
        font: 10px var(--mono);
        text-transform: uppercase;
      }

      .fix-sketch-button[aria-pressed="true"] {
        background: var(--acid);
        color: var(--ink);
      }

      body.xr-active .fix-sketch-button { display: none; }

      .wash {
        position: absolute;
        z-index: 0;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(8, 10, 8, .52), transparent 25%, transparent 67%, rgba(8, 10, 8, .66));
        opacity: 0;
        transition: opacity .35s ease;
      }

      .stage.is-live .wash { opacity: 1; }

      .xr-renderer {
        position: fixed;
        z-index: 10;                                    
        inset: 0;
        display: none;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      body.xr-active .xr-renderer { display: block; }

      .xr-hud {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: none;
        pointer-events: none;
      }

      body.xr-active .xr-hud { display: block; }

      .xr-placement-controls {
        position: absolute;
        bottom: max(30px, env(safe-area-inset-bottom));
        left: 50%;
        display: grid;
        justify-items: center;
        gap: 10px;
        transform: translateX(-50%);
      }

      .xr-placement-hint {
        margin: 0;
        padding: 8px 12px;
        background: rgba(16, 19, 17, .78);
        color: var(--paper);
        font: 11px var(--mono);
        white-space: nowrap;
      }

      .xr-placement-button {
        min-width: 168px;
        min-height: 50px;
        padding: 0 18px;
        border: 1px solid var(--acid);
        background: var(--acid);
        color: var(--ink);
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        pointer-events: auto;
      }

      .xr-placement-button:disabled {
        border-color: rgba(238, 241, 233, .3);
        background: rgba(16, 19, 17, .78);
        color: rgba(238, 241, 233, .5);
        cursor: default;
      }

      .topbar, .bottombar {
        position: absolute;
        z-index: 2;
        right: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .topbar {
        top: 0;
        min-height: 76px;
        padding: max(22px, env(safe-area-inset-top)) clamp(22px, 4.2vw, 64px) 14px;
      }

      .wordmark {
        display: flex;
        align-items: center;
        gap: 13px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      .wordmark-mark {
        display: grid;
        width: 27px;
        aspect-ratio: 1;
        place-items: center;
        border: 1px solid var(--acid);
        color: var(--acid);
        font: 500 12px var(--mono);
        letter-spacing: 0;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--paper);
        font: 11px var(--mono);
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #737b72;
      }

      .is-live .status-dot {
        background: var(--acid);
        box-shadow: 0 0 12px rgba(212, 243, 106, .65);
      }

      .viewfinder {
        position: absolute;
        inset: clamp(80px, 12vh, 120px) clamp(18px, 6vw, 92px) clamp(112px, 17vh, 164px);
        pointer-events: none;
        transition: opacity .35s ease;
      }

      .viewfinder::before, .viewfinder::after {
        position: absolute;
        width: 26px;
        height: 26px;
        content: "";
        opacity: .65;
      }

      .viewfinder::before {
        top: 0;
        left: 0;
        border-top: 1px solid var(--acid);
        border-left: 1px solid var(--acid);
      }

      .viewfinder::after {
        right: 0;
        bottom: 0;
        border-right: 1px solid var(--acid);
        border-bottom: 1px solid var(--acid);
      }

      .finder-corner {
        position: absolute;
        width: 26px;
        height: 26px;
        opacity: .65;
      }

      .finder-corner.top-right {
        top: 0;
        right: 0;
        border-top: 1px solid var(--acid);
        border-right: 1px solid var(--acid);
      }

      .finder-corner.bottom-left {
        bottom: 0;
        left: 0;
        border-bottom: 1px solid var(--acid);
        border-left: 1px solid var(--acid);
      }

      .crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 18px;
        height: 18px;
        transform: translate(-50%, -50%);
        opacity: .38;
      }

      .crosshair::before, .crosshair::after {
        position: absolute;
        top: 50%;
        left: 50%;
        content: "";
        background: var(--paper);
        transform: translate(-50%, -50%);
      }

      .crosshair::before { width: 1px; height: 18px; }
      .crosshair::after { width: 18px; height: 1px; }

      .idle-copy {
        position: absolute;
        z-index: 1;
        top: 50%;
        left: clamp(30px, 12vw, 180px);
        width: min(560px, calc(100% - 60px));
        transform: translateY(-50%);
        transition: opacity .25s ease, transform .35s ease;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 22px;
        color: var(--acid);
        font: 11px var(--mono);
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 25px;
        height: 1px;
        background: currentColor;
        content: "";
      }

      h1 {
        max-width: 540px;
        margin: 0;
        font-size: clamp(54px, 8vw, 108px);
        font-weight: 500;
        line-height: .93;
      }

      h1 span { color: var(--acid); }

      .start-button {
        display: inline-flex;
        min-height: 54px;
        align-items: center;
        gap: 20px;
        margin-top: 36px;
        padding: 0 19px;
        border: 1px solid var(--acid);
        background: var(--acid);
        color: var(--ink);
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: background .2s ease, color .2s ease, transform .2s ease;
      }

      .action-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

      .xr-start-button {
        min-height: 54px;
        padding: 0 18px;
        border: 1px solid rgba(238, 241, 233, .58);
        background: rgba(16, 19, 17, .35);
        color: var(--paper);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: border-color .2s ease, color .2s ease, background .2s ease;
      }

      .xr-start-button:hover { border-color: var(--acid); color: var(--acid); }
      .xr-start-button[hidden] { display: none; }

      .start-button:hover { background: transparent; color: var(--acid); }
      .start-button:active { transform: scale(.98); }

      .button-arrow {
        display: grid;
        width: 23px;
        height: 23px;
        place-items: center;
        border: 1px solid currentColor;
        font: 14px var(--mono);
      }

      .error-message {
        max-width: 390px;
        min-height: 1.4em;
        margin: 14px 0 0;
        color: #f2a99b;
        font: 12px/1.5 var(--mono);
      }

      .side-readout {
        position: absolute;
        z-index: 2;
        top: 50%;
        right: clamp(24px, 4.2vw, 64px);
        display: flex;
        align-items: center;
        gap: 12px;
        color: rgba(238, 241, 233, .58);
        font: 10px var(--mono);
        letter-spacing: .08em;
        writing-mode: vertical-rl;
        text-transform: uppercase;
        transform: translateY(-50%);
      }

      .side-readout::before {
        width: 1px;
        height: 44px;
        background: var(--acid);
        content: "";
      }

      .bottombar {
        bottom: 0;
        min-height: 94px;
        padding: 15px clamp(22px, 4.2vw, 64px) max(22px, env(safe-area-inset-bottom));
      }

      .bottom-note {
        color: rgba(238, 241, 233, .62);
        font: 10px var(--mono);
        letter-spacing: .06em;
        text-transform: uppercase;
      }

      .controls { display: flex; align-items: center; gap: 10px; }

      .control-button {
        display: grid;
        width: 46px;
        height: 46px;
        place-items: center;
        border: 1px solid rgba(238, 241, 233, .45);
        border-radius: 50%;
        background: rgba(16, 19, 17, .46);
        color: var(--paper);
        cursor: pointer;
        backdrop-filter: blur(12px);
        transition: border-color .2s ease, background .2s ease, color .2s ease;
      }

      .control-button:hover { border-color: var(--acid); color: var(--acid); }
      .control-button svg { width: 18px; height: 18px; }

      .stage.is-live .idle-copy {
        opacity: 0;
        pointer-events: none;
        transform: translateY(calc(-50% + 12px));
      }

      .stage.is-live .viewfinder { opacity: .55; }
      .stage.is-live .side-readout { color: rgba(238, 241, 233, .82); }

      .xr-hud .sketch-controls {
        top: max(20px, env(safe-area-inset-top));
        right: clamp(16px, 4vw, 48px);
        bottom: auto;
      }

      button:focus-visible { outline: 2px solid var(--acid); outline-offset: 4px; }

      @media (max-width: 600px) {
        .topbar { min-height: 66px; padding-right: 22px; padding-left: 22px; }
        .wordmark { gap: 10px; font-size: 11px; }
        .status { font-size: 9px; }
        .idle-copy { left: 28px; width: calc(100% - 56px); }
        h1 { font-size: clamp(56px, 15vw, 84px); }
        .eyebrow { margin-bottom: 18px; }
        .start-button { margin-top: 28px; }
        .viewfinder { inset: 82px 20px 128px; }
        .sketch-overlay { width: min(72vw, 360px); max-height: 48vh; }
        .sketch-controls { right: 12px; bottom: 88px; width: min(280px, calc(100vw - 24px)); }
        .xr-hud .sketch-controls { top: max(72px, env(safe-area-inset-top)); right: 12px; }
        .side-readout { right: 23px; font-size: 9px; }
        .bottombar { min-height: 78px; padding-right: 22px; padding-left: 22px; }
        .bottom-note { font-size: 9px; }
        .control-button { width: 42px; height: 42px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="stage" id="stage">
      <video class="camera-feed" id="cameraFeed" autoplay muted playsinline aria-label="Live camera view"></video>
      <div class="wash" aria-hidden="true"></div>
      <img class="sketch-overlay" src="sketch-1.jpg" alt="Sketch reference" draggable="false">
      <div class="sketch-controls" id="sketchControls" aria-label="Sketch adjustments">
        <label class="sketch-control" for="sketchSize">
          <span>Size</span>
          <input id="sketchSize" type="range" min="50" max="200" value="100" aria-label="Sketch size">
          <output id="sketchSizeValue" for="sketchSize">100%</output>
        </label>
        <label class="sketch-control" for="sketchOpacity">
          <span>Opacity</span>
          <input id="sketchOpacity" type="range" min="10" max="100" value="50" aria-label="Sketch opacity">
          <output id="sketchOpacityValue" for="sketchOpacity">50%</output>
        </label>
        <button class="fix-sketch-button" id="fixSketchButton" type="button" aria-pressed="false">Fix in place</button>
      </div>

      <header class="topbar">
        <div class="wordmark"><span class="wordmark-mark">F</span><span>Field / Camera</span></div>
        <div class="status" aria-live="polite"><span class="status-dot"></span><span id="statusText">Camera off</span></div>
      </header>

      <div class="viewfinder" aria-hidden="true">
        <span class="finder-corner top-right"></span>
        <span class="finder-corner bottom-left"></span>
        <span class="crosshair"></span>
      </div>

      <section class="idle-copy" aria-label="Camera controls">
        <p class="eyebrow">Live view / 01</p>
        <h1>Look closer<span>.</span></h1>
        <div class="action-row">
          <button class="start-button" id="startButton" type="button">
            <span>Start camera</span><span class="button-arrow" aria-hidden="true">↗</span>
          </button>
          <button class="xr-start-button" id="xrButton" type="button" hidden>Enter headset AR</button>
        </div>
        <p class="error-message" id="errorMessage" role="status"></p>
      </section>

      <div class="side-readout" aria-hidden="true">Environment / visible</div>

      <footer class="bottombar">
        <span class="bottom-note" id="bottomNote">Waiting for camera</span>
        <div class="controls">
          <button class="control-button" id="flipButton" type="button" aria-label="Switch camera" title="Switch camera" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-4V3"/><path d="M4 17h4v4"/><path d="M5.64 9A7 7 0 0 1 17.5 5.5L20 7M4 17l2.5 1.5A7 7 0 0 0 18.36 15"/></svg>
          </button>
          <button class="control-button" id="stopButton" type="button" aria-label="Stop camera" title="Stop camera" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
          </button>
        </div>
      </footer>
    </main>
    <div class="xr-hud" id="xrHud">
      <div class="xr-placement-controls">
        <p class="xr-placement-hint" id="xrPlacementHint">Aim at a surface to position the sketch</p>
        <button class="xr-placement-button" id="placeSketchButton" type="button" disabled>Fix it here</button>
      </div>
    </div>

    <script>
      const stage = document.querySelector("#stage");
      const video = document.querySelector("#cameraFeed");
      const statusText = document.querySelector("#statusText");
      const bottomNote = document.querySelector("#bottomNote");
      const errorMessage = document.querySelector("#errorMessage");
      const startButton = document.querySelector("#startButton");
      const xrButton = document.querySelector("#xrButton");
      const flipButton = document.querySelector("#flipButton");
      const stopButton = document.querySelector("#stopButton");
      const sketch = document.querySelector(".sketch-overlay");
      const sketchControls = document.querySelector("#sketchControls");
      const sketchSize = document.querySelector("#sketchSize");
      const sketchOpacity = document.querySelector("#sketchOpacity");
      const sketchSizeValue = document.querySelector("#sketchSizeValue");
      const sketchOpacityValue = document.querySelector("#sketchOpacityValue");
      const fixSketchButton = document.querySelector("#fixSketchButton");
      let stream = null;
      let facingMode = "environment";
      let isSketchFixed = false;

      function setSketchPosition(centerX, centerY) {
        const stageBounds = stage.getBoundingClientRect();
        const sketchBounds = sketch.getBoundingClientRect();
        const halfWidth = sketchBounds.width / 2;
        const halfHeight = sketchBounds.height / 2;
        const x = Math.max(halfWidth, Math.min(stageBounds.width - halfWidth, centerX));
        const y = Math.max(halfHeight, Math.min(stageBounds.height - halfHeight, centerY));
        sketch.style.left = `${(x / stageBounds.width) * 100}%`;
        sketch.style.top = `${(y / stageBounds.height) * 100}%`;
      }

      function updateSizeLimit() {
        if (document.body.classList.contains("xr-active")) return;
        const stageBounds = stage.getBoundingClientRect();
        const appliedScale = Number(getComputedStyle(sketch).getPropertyValue("--sketch-scale")) || 1;
        const sketchBounds = sketch.getBoundingClientRect();
        const baseWidth = sketchBounds.width / appliedScale;
        const baseHeight = sketchBounds.height / appliedScale;
        if (!baseWidth || !baseHeight) return;
        const maxScale = Math.min((stageBounds.width - 32) / baseWidth, (stageBounds.height - 32) / baseHeight, 2);
        sketchSize.max = String(Math.max(25, Math.floor(maxScale * 100)));
        if (Number(sketchSize.value) > Number(sketchSize.max)) sketchSize.value = sketchSize.max;
      }

      function updateSketchAdjustments() {
        updateSizeLimit();
        const size = Number(sketchSize.value);
        const opacity = Number(sketchOpacity.value);
        sketch.style.setProperty("--sketch-scale", size / 100);
        sketch.style.opacity = opacity / 100;
        sketchSizeValue.value = `${size}%`;
        sketchOpacityValue.value = `${opacity}%`;
        const stageBounds = stage.getBoundingClientRect();
        const sketchBounds = sketch.getBoundingClientRect();
        setSketchPosition(
          sketchBounds.left - stageBounds.left + sketchBounds.width / 2,
          sketchBounds.top - stageBounds.top + sketchBounds.height / 2
        );
        document.dispatchEvent(new CustomEvent("sketchadjust", { detail: { size: size / 100, opacity: opacity / 100 } }));
      }

      sketchSize.addEventListener("input", updateSketchAdjustments);
      sketchOpacity.addEventListener("input", updateSketchAdjustments);
      sketch.addEventListener("load", updateSketchAdjustments);
      window.addEventListener("resize", updateSketchAdjustments);
      updateSketchAdjustments();

      fixSketchButton.addEventListener("click", () => {
        if (!xrButton.hidden) {
          document.dispatchEvent(new Event("start-room-anchor"));
          return;
        }
        isSketchFixed = !isSketchFixed;
        fixSketchButton.setAttribute("aria-pressed", String(isSketchFixed));
        fixSketchButton.textContent = isSketchFixed ? "Move sketch" : "Fix in place";
        sketch.classList.toggle("is-fixed", isSketchFixed);
        bottomNote.textContent = isSketchFixed ? "Locked to camera view only" : "Camera connected";
      });

      stage.addEventListener("pointerdown", (event) => {
        if (isSketchFixed || event.target.closest("button, input, label, select, textarea, a, [role='button'], .topbar, .bottombar, .side-readout")) return;
        const sketchBounds = sketch.getBoundingClientRect();
        if (
          event.clientX < sketchBounds.left || event.clientX > sketchBounds.right ||
          event.clientY < sketchBounds.top || event.clientY > sketchBounds.bottom
        ) return;
        event.preventDefault();
        stage.setPointerCapture(event.pointerId);
        sketch.classList.add("is-dragging");
        sketch.dataset.dragOffsetX = event.clientX - sketchBounds.left - sketchBounds.width / 2;
        sketch.dataset.dragOffsetY = event.clientY - sketchBounds.top - sketchBounds.height / 2;
      });

      stage.addEventListener("pointermove", (event) => {
        if (!stage.hasPointerCapture(event.pointerId)) return;
        const bounds = stage.getBoundingClientRect();
        const centerX = event.clientX - Number(sketch.dataset.dragOffsetX);
        const centerY = event.clientY - Number(sketch.dataset.dragOffsetY);
        setSketchPosition(centerX - bounds.left, centerY - bounds.top);
      });

      function finishSketchDrag(event) {
        if (stage.hasPointerCapture(event.pointerId)) stage.releasePointerCapture(event.pointerId);
        sketch.classList.remove("is-dragging");
      }

      stage.addEventListener("pointerup", finishSketchDrag);
      stage.addEventListener("pointercancel", finishSketchDrag);

      function moveSketchBy(moveX, moveY) {
        const stageBounds = stage.getBoundingClientRect();
        const sketchBounds = sketch.getBoundingClientRect();
        const centerX = sketchBounds.left - stageBounds.left + sketchBounds.width / 2;
        const centerY = sketchBounds.top - stageBounds.top + sketchBounds.height / 2;
        setSketchPosition(centerX + moveX * 24, centerY + moveY * 24);
        document.dispatchEvent(new CustomEvent("sketchmove", { detail: { x: moveX, y: moveY } }));
      }

      document.addEventListener("keydown", (event) => {
        if (!stage.classList.contains("is-live") || document.body.classList.contains("xr-active")) return;
        if (event.target.closest("input, textarea, select, [contenteditable='true']")) return;
        const directions = {
          ArrowLeft: [-1, 0],
          ArrowRight: [1, 0],
          ArrowUp: [0, -1],
          ArrowDown: [0, 1]
        };

                  reticle.visible = hasTarget && !isFixed;
                  placeSketchButton.disabled = false;
                  if (hasTarget !== targetPreviouslyFound) {
                    updateActionButton(isFixed ? "MOVE SKETCH" : hasTarget ? "FIX IT HERE" : "FIX IN FRONT");
                  }
                  targetPreviouslyFound = hasTarget;
                  if (!isFixed) {
                    xrPlacementHint.textContent = hasTarget
                      ? "Surface found · press the trigger on FIX IT HERE"
                      : "No plane found · press the trigger on FIX IN FRONT";
                  }
                }
                renderer.render(scene, camera);
              });
            });

            renderer.xr.addEventListener("sessionend", () => {
              renderer.setAnimationLoop(null);
              stage.appendChild(sketchControls);
              currentTargetMatrix = null;
              if (placementAnchor) placementAnchor.delete();
              placementAnchor = null;
              isFixed = false;
              hasBeenPlaced = false;
              anchorGeneration += 1;
              placementRequested = false;
              previousButtonStates.clear();
              actionButton.visible = false;
              placeSketchButton.hidden = false;
              document.body.classList.remove("xr-active");
              for (const record of controllerRecords) {
                record.dragging = null;
              }
              sketchSize.dispatchEvent(new Event("input", { bubbles: true }));
              statusText.textContent = "Camera off";
              bottomNote.textContent = "Waiting for camera";
            });

            placeSketchButton.addEventListener("click", togglePlacement);

            xrButton.hidden = false;
            fixSketchButton.textContent = "Fix in room";
            fixSketchButton.title = "Enter headset AR to anchor the sketch to a room surface";
            async function startXRSession() {
              if (xrButton.disabled) return;
              xrButton.disabled = true;
              errorMessage.textContent = "";
              let session = null;
              try {
                session = await navigator.xr.requestSession("immersive-ar", {
                  requiredFeatures: ["plane-detection"],
                  optionalFeatures: ["local-floor", "anchors"]
                });
                await renderer.xr.setSession(session);
              } catch (error) {
                if (session) await session.end();
                errorMessage.textContent = `WebXR startup failed (${error.name}): ${error.message || "Unknown error"}`;
              } finally {
                xrButton.disabled = false;
              }
            }

            xrButton.addEventListener("click", startXRSession);
            document.addEventListener("start-room-anchor", startXRSession);

          }
        } catch (error) {
          errorMessage.textContent = "Unable to load headset AR support. Check your connection and use the camera preview instead.";
        }
      }
    </script>
  </body>
</html>
